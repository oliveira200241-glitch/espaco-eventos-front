<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro | EventSpace Manager</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="pagina-autenticacao">

    <main class="auth-container">

        <section class="auth-card cadastro-card">

            <div class="logo-auth">

                <img
                    src="img/logo-eventspace.png"
                    alt="EventSpace Manager"
                >

            </div>


            <div class="auth-header">

                <span class="auth-tag">
                    EVENTSPACE MANAGER
                </span>

                <h1>
                    Criar conta
                </h1>

                <p>
                    Cadastre-se para começar
                </p>

            </div>


            <div class="tipo-usuario">

                <button
                    type="button"
                    id="btnCliente"
                    class="tipo-btn ativo"
                >

                    <span class="tipo-icone">
                        👤
                    </span>

                    <span>
                        Cliente
                    </span>

                </button>


                <button
                    type="button"
                    id="btnGestor"
                    class="tipo-btn"
                >

                    <span class="tipo-icone">
                        🏢
                    </span>

                    <span>
                        Gestor
                    </span>

                </button>

            </div>


            <form id="formCadastro">

                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@exemplo.com"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="documento">
                        CPF/CNPJ
                    </label>

                    <input
                        type="text"
                        id="documento"
                        placeholder="Digite seu CPF ou CNPJ"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        placeholder="(84) 99999-9999"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        minlength="6"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-principal"
                >

                    <span>
                        Criar conta
                    </span>

                    <strong>
                        →
                    </strong>

                </button>


                <p
                    id="mensagem"
                    class="mensagem"
                ></p>

            </form>


            <div class="separador">
                <span>ou</span>
            </div>


            <div class="auth-footer">

                <p>
                    Já possui uma conta?
                </p>

                <a href="index.html">
                    Fazer login
                    <span>→</span>
                </a>

            </div>


            <div class="auth-bottom">
                Gestão de espaços e eventos
            </div>

        </section>

    </main>


    <script src="js/cadastro.js"></script>

</body>

</html>
